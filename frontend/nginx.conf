server {
    listen 80;
    server_name localhost;

    # Serve the React application
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # React router fallback
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API requests to the Render backend service
    location /api/v1/ {
        proxy_pass https://docker-cloud-xajt.onrender.com/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host docker-cloud-xajt.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy outputs (images/PDFs) to the Render backend service
    location /outputs/ {
        proxy_pass https://docker-cloud-xajt.onrender.com/outputs/;
        proxy_http_version 1.1;
        proxy_set_header Host docker-cloud-xajt.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
