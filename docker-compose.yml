services:

  # ── Frontend (React + Nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"   # Access the app at http://localhost:3000
    depends_on:
      api:
        condition: service_started

  # ── Message Broker (Redis) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend API (FastAPI) ─────────────────────────────────────────────
  api:
    build: 
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000" # Expose the API optionally if needed directly
    environment:
      REDIS_URL: redis://redis:6379/0
      EASYOCR_MODULE_PATH: /app/.EasyOCR
    volumes:
      - storage_data:/app/storage
      - ./backend/model_weights:/app/model_weights:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # ── AI Processing Engine (Celery Worker) ──────────────────────────────
  worker:
    build: 
      context: ./backend
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      EASYOCR_MODULE_PATH: /app/.EasyOCR
    volumes:
      - storage_data:/app/storage
      - ./backend/model_weights:/app/model_weights:ro
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
        --loglevel=info
        --concurrency=1
        --queues=celery
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data:
  storage_data:
